name: Bug report
description: Report a reproducible OpenSession defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private process in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest reliable sequence of steps. Remove personal, tenant, and credential data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or deployment
      placeholder: Commit SHA, branch, or deployment date
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Organizer
        - Reviewer
        - Speaker portal
        - Public schedule
        - API or integration
        - Deployment or operations
    validations:
      required: true
