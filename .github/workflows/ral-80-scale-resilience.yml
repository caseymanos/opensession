name: RAL-80 scale resilience

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ral-80-scale-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-resilience:
    name: Production-like scale resilience
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production web assets
        run: pnpm build:web
      - name: Enforce scale and resilience budgets
        run: pnpm exec vitest run --config vitest.config.ts workers/app/test/scale-resilience.test.ts --reporter=verbose
      - name: Upload scale and resilience receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ral-80-scale-resilience-evidence
          path: coverage/ral-80-scale-resilience.json
          if-no-files-found: error
          retention-days: 14
